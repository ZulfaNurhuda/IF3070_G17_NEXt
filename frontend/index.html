<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEXt Ship Loader</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
    <link rel="stylesheet" href="./styles/ship.css" />
    <link rel="stylesheet" href="./styles/chart.css" />
  </head>
  <body>
    <header class="row">
      <select id="file-select" class="grow"></select>
      <select id="run-select"></select>
    </header>

    <main class="layout">
      <section>
        <svg id="ship" role="img" aria-label="Grid kapal"></svg>
        <div class="row controls">
          <button id="step-back" type="button">Back</button>
          <button id="step-next" type="button" class="primary">Next</button>
          <span id="step-label" class="muted push-right"></span>
        </div>
      </section>

      <section class="panel">
        <div>
          <div id="unit-label" class="muted"></div>
          <div id="iteration" class="big"></div>
        </div>
        <div>
          <div class="muted">Nilai</div>
          <div id="value" class="big"></div>
          <div id="weight" class="muted"></div>
        </div>
        <div>
          <div class="muted">Perubahan</div>
          <div id="change"></div>
        </div>
        <div id="note"></div>
        <div>
          <div class="muted">Di luar kapal</div>
          <div id="outside"></div>
        </div>
        <details>
          <summary class="muted">Detail run</summary>
          <div id="details" class="details"></div>
        </details>
      </section>
    </main>

    <section class="charts">
      <div id="chart-title" class="muted"></div>
      <svg id="history-chart" role="img" aria-label="Grafik nilai terhadap iterasi"></svg>
      <div id="probability-section" class="charts-secondary" hidden>
        <div class="muted">Peluang penerimaan e^(ΔE/T)</div>
        <svg id="probability-chart" role="img" aria-label="Grafik peluang penerimaan"></svg>
      </div>
    </section>

    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
